[package]
name = "idarasyn"
version = "0.1.0"
edition = "2021"

[dependencies]
pnet = "0.35"
tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[profile.release]
opt-level = 2
lto = false
strip = true
